<div style="width: 760px; height: 640px; box-sizing: border-box; padding: 32px; background: #D9CBB9; display: flex; align-items: flex-start; justify-content: center;">

      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px;">
        <h2 id="st1-title" style="font-size: 24px;">Start a series</h2>
        <p class="meta" style="margin: 0; font-size: 14.5px;">Say it the way you would to a colleague. Fuzz finds the tasks, people and places that go with it, and you check them next.</p>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; color: #3A2A20; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">

    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
