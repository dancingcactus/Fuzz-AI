<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New task · the + menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Nunito Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;color:#3A2A20}
a{color:#A23F1B}a:hover{color:#7A2A0E}
h1{margin:0;font-family:"Nunito",system-ui,sans-serif;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid #E8D9C5;background:#FFFBF4;color:#3A2A20;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:#B94E28;border-color:#B94E28;color:#FFFFFF}
.meta{color:#7A6454;font-size:13.5px}
.plusbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:1.5px solid #E8D9C5;background:#FFFBF4;color:#3A2A20;cursor:pointer;text-decoration:none}
.plusbtn.on{border-color:#B94E28;color:#B94E28}
.mi{display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px 12px;min-height:44px;border:0;border-radius:12px;background:transparent;font:inherit;color:#3A2A20;text-align:left;cursor:pointer;text-decoration:none;box-sizing:border-box}
.mi:hover{background:#F0E1CC}
.mi b{display:block;font-weight:700}
.mi small{display:block;color:#7A6454;font-size:13px;line-height:1.35}
.mi svg{flex:none;margin-top:2px}
</style>
</helmet>
<div style="width: 760px; height: 860px; box-sizing: border-box; background: #FBF3E8; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 14px;" aria-hidden="true">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#B94E28" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 4 4-4"></path><rect x="3" y="7" width="18" height="13" rx="4" fill="#B94E28"></rect><rect x="6" y="10" width="12" height="7" rx="2" fill="#3A3A3A" stroke="none"></rect><circle cx="10" cy="13.5" r="1" fill="#FFC65C" stroke="none"></circle><circle cx="14" cy="13.5" r="1" fill="#FFC65C" stroke="none"></circle></svg>
    <div style="background: #FFFBF4; border: 1px solid #E8D9C5; border-radius: 16px; padding: 10px 14px; font-weight: 600;">Get it out of your head. I’ll sort it later.</div>
  </div>

  <div style="background: #FFFBF4; border: 1px solid #E8D9C5; border-radius: 22px; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 rgba(58,42,32,.06), 0 14px 30px -14px rgba(58,42,32,.30);">
    <h1 style="font-size: 27px;">What is on your mind?</h1>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="c1-text" style="font-weight: 700; font-size: 14px;">New task</label>
      <textarea id="c1-text" rows="3" style="width: 100%; box-sizing: border-box; background: #F6EBDB; border: 1px solid #E8D9C5; border-radius: 12px; padding: 10px 12px; font: inherit; color: #3A2A20; line-height: 1.45;">Q1 pricing change. Finance wants the new tiers live by March, and I’m pulling the customer comms together.</textarea>
    </div>

    <div style="position: relative; display: flex; align-items: center; gap: 8px;">
      <a class="plusbtn on" href="Capture2.dc.html" aria-haspopup="menu" aria-expanded="true" aria-label="Add a series, person, source, artifact or file"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
      <button type="button" class="plusbtn" aria-label="Dictate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg></button>
      <span class="meta">Add a series, a person, a source or a file</span>

      <div role="menu" aria-label="Add to this task" style="position: absolute; left: 0; top: 52px; width: 340px; background: #FFFBF4; border: 1px solid #E8D9C5; border-radius: 16px; padding: 6px; box-shadow: 0 1px 0 rgba(58,42,32,.06), 0 18px 36px -14px rgba(58,42,32,.42); display: flex; flex-direction: column; gap: 2px; z-index: 2;">
        <a role="menuitem" class="mi" href="Capture2.dc.html" style="background: #F6DCCD;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A2F10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H7a2 2 0 00-2 2v13a2 2 0 002 2h10a2 2 0 002-2V6a2 2 0 00-2-2h-2"></path><rect x="9" y="2" width="6" height="4" rx="1"></rect><path d="M9 12h6M9 16h4"></path></svg>
          <span><b>Series</b><small>Put it in one, or start a new one from this</small></span>
        </a>
        <button type="button" role="menuitem" class="mi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0116 0"></path></svg>
          <span><b>Person</b><small>Who it’s for, or who it’s about</small></span>
        </button>
        <button type="button" role="menuitem" class="mi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"></path><path d="M4 7l8 6 8-6"></path></svg>
          <span><b>Source</b><small>An email, Slack thread or meeting Fuzz should read</small></span>
        </button>
        <button type="button" role="menuitem" class="mi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"></path><path d="M14 3v5h5"></path></svg>
          <span><b>Artifact</b><small>Something Fuzz already made</small></span>
        </button>
        <button type="button" role="menuitem" class="mi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"></path></svg>
          <span><b>Upload a file</b><small>Or drop it on the box</small></span>
        </button>
      </div>
    </div>

    <div style="height: 300px;" aria-hidden="true"></div>

    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <button type="button" class="btn primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Capture</button>
      <span class="meta">Ctrl or Cmd + Enter to capture · Esc to go back</span>
    </div>
  </div>
</div>
</x-dc>
