<meta charset="utf-8">
<title>Series List Mocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: the app's own centered Lineup column inside a framed "screen", one mock at a time, with design notes above it.
   Tokens are Fuzz's Warm Theme System, Terracotta (js/themes.js), light and dark. */
:root {
  --font-display: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #FBF3E8; --surface: #FFFBF4; --field: #F6EBDB; --ink: #3A2A20; --muted: #7A6454; --line: #E8D9C5; --chip: #F0E1CC;
  --done: #3E7B4F; --wait: #A86B12; --blocked: #B23A32;
  --accent: #B94E28; --on-accent: #FFFFFF; --link: #A23F1B;
  --note: #EFE4D3; --on-done: #3A2A20;
  --shadow: 0 1px 0 color-mix(in srgb, var(--ink) 6%, transparent), 0 14px 30px -14px color-mix(in srgb, var(--ink) 38%, transparent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E1612; --surface: #2A201A; --field: #352920; --ink: #F4E8DB; --muted: #C2AB98; --line: #43352B; --chip: #3B2D23;
  --done: #8CC59A; --wait: #E8B65E; --blocked: #F28C80; --accent: #E8855A; --on-accent: #2A140A; --link: #F0A07C; --note: #2E241D; --on-done: #1E1612; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1E1612; --surface: #2A201A; --field: #352920; --ink: #F4E8DB; --muted: #C2AB98; --line: #43352B; --chip: #3B2D23;
  --done: #8CC59A; --wait: #E8B65E; --blocked: #F28C80; --accent: #E8855A; --on-accent: #2A140A; --link: #F0A07C; --note: #2E241D; --on-done: #1E1612; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---- the mock picker and notes (outside the app) ---- */
.intro h1 { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.intro p { color: var(--muted); max-width: 64ch; margin-top: 4px; }
.picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 999px; background: var(--chip); width: fit-content; max-width: 100%; }
.picker button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; min-height: 36px; font-weight: 700; font-size: 14px; color: var(--ink); opacity: .82; }
.picker button[aria-selected="true"] { opacity: 1; }
.picker button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 18%, transparent); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px 24px; padding: 14px 18px; border-radius: 14px; background: var(--note); border: 1.5px dashed var(--line); font-size: 14px; }
.notes h3 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
.notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }

/* ---- the app frame ---- */
.screen { border-radius: 18px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; box-shadow: var(--shadow); }
.appbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.appbar .logo { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.appbar .logo svg { width: 26px; height: 23px; }
.appbar .crumb { color: var(--muted); }
.appbar .crumb b { color: var(--ink); font-weight: 700; }
.appbar .newbtn { margin-left: auto; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 5px 14px; font-weight: 700; }
.page { max-width: 620px; margin: 0 auto; padding: 22px 16px 34px; display: flex; flex-direction: column; gap: 20px; }
.page.wide { max-width: none; }

/* app bits, as in css/app.css */
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.head h1 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.head .meta { flex: 1 1 260px; }
.meta { color: var(--muted); font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; min-height: 34px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pill { --tone: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 10px;
  background: color-mix(in srgb, var(--tone) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone) 38%, var(--surface)); color: var(--ink); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tone); flex: none; }
.pill.icon::before { display: none; }
.pill svg { flex: none; color: var(--tone); }
.t-accent { --tone: var(--accent); } .t-ok { --tone: var(--done); } .t-wait { --tone: var(--wait); } .t-muted { --tone: var(--muted); }
.lsec { display: flex; flex-direction: column; gap: 10px; }
.lsec h2 { font-family: var(--font-display); font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.lcount { min-width: 24px; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-family: var(--font-body); font-size: 12.5px; font-weight: 600; text-align: center; }
.lrows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.lrows > li + li { border-top: 1px solid var(--line); }
.lrow { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 12px 16px; border: 0; background: transparent; text-align: left; color: var(--ink); }
.lrow:hover { background: var(--field); }
.lrow:focus-visible { outline-offset: -3px; }
.lrow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lrow-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 42%; text-align: right; }
.rt { font-size: 15.5px; font-weight: 700; line-height: 1.35; }
.rs { font-size: 13px; color: var(--muted); line-height: 1.4; }
.ra { font-size: 14px; line-height: 1.4; }
.go { flex: none; color: var(--muted); display: inline-flex; }
.lrow:hover .go { color: var(--ink); }
.fold summary { cursor: pointer; list-style: none; min-height: 40px; display: flex; align-items: center; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary h2::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); margin-right: 4px; transition: transform .2s; }
.fold[open] summary h2::before { transform: rotate(45deg); }
.fold[open] summary { margin-bottom: 10px; }
.guess { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.avs { display: inline-flex; padding-left: 6px; }
.av { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-left: -6px; border-radius: 50%; background: var(--chip); color: var(--ink); border: 2px solid var(--surface); font-size: 10px; font-weight: 800; }

/* Fuzz says (a small Fuzz on other pages) */
.says { display: flex; gap: 12px; align-items: flex-start; }
.says svg { flex: none; width: 40px; height: 35px; margin-top: 2px; }
.says p { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; font-size: 14px; line-height: 1.45; max-width: 60ch; }
.says .x { color: var(--muted); font-size: 13px; margin-left: 4px; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; }

/* Now: today's grid */
.scards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.scard { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.scard-name { font-family: var(--font-display); font-size: 17px; font-weight: 800; }
.scard-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; }
.scard-foot .btn { margin-left: auto; }

/* A: rows with an icon tile */
.tile { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.tile.quiet { background: var(--field); color: var(--muted); border-color: var(--line); }

/* B: episodes */
.ep { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; cursor: pointer; transition: background-color .15s; }
.ep:hover { background: var(--field); }
.ep-name { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); font: inherit; font-size: 15.5px; font-weight: 700; line-height: 1.35; }
.ep:hover .ep-name, .ep-name:focus-visible { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.ep-edit { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; min-height: 30px; font-size: 13px; font-weight: 700; }
.ep:hover .ep-edit, .ep-edit:focus-visible { color: var(--ink); border-color: var(--line); background: var(--surface); }
.ep-edit:hover { border-color: var(--accent) !important; }
/* past 20 tasks: the done count in fives, a square just wide enough for three digits, the colour of a done dot */
.dot.five { width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--on-done); }
.more { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 2px; }
/* ---- the series page, opened in place like an artifact (artifact.html): back pill, title, actions; one column ---- */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.fld { font: inherit; font-size: 15px; font-weight: 400; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 40px; width: 100%; min-width: 0; }
.fld:focus { outline: 3px solid var(--link); outline-offset: 1px; }
textarea.fld { resize: vertical; min-height: 64px; line-height: 1.45; }
.appbar.dbar { gap: 12px; padding: 10px 16px; }
.dback { flex: none; padding-left: 8px; }
.dtitle { flex: 1; min-width: 0; }
.dtitle h1 { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
.dtitle .meta { font-size: 13px; }
.dacts { flex: none; display: flex; gap: 6px; align-items: center; position: relative; }
.dmore summary { list-style: none; padding: 6px 10px; }
.dmore summary::-webkit-details-marker { display: none; }
.dmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: min(300px, calc(100vw - 48px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; }
.dmenu button { text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 1px; }
.dmenu button:hover { background: var(--field); }
.dmenu b { font-weight: 700; font-size: 14px; }
.dmenu span { font-size: 12.5px; color: var(--muted); }
.dmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.page.dpage { max-width: 720px; gap: 26px; }
.dhero { display: flex; flex-direction: column; gap: 8px; }
.dabout { display: flex; gap: 8px; align-items: flex-start; }
.dabout p { flex: 1; font-size: 17px; line-height: 1.5; text-wrap: pretty; }
.dpen { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; width: 32px; height: 32px; display: grid; place-items: center; }
.dpen:hover { color: var(--ink); border-color: var(--accent); }
.dsec { display: flex; flex-direction: column; gap: 10px; }
.dsec-h { display: flex; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
.dsec-h h2 { font-family: var(--font-display); font-size: 18px; font-weight: 800; }
.dsec-h .meta { flex: 1 1 240px; }
.dnext { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.dnext b { font-size: 15.5px; }
.dnext .acts, .eform .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.facts li { display: block; }
.fact { width: 100%; display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 2px 14px; align-items: start; padding: 12px 16px; border: 0; background: transparent; text-align: left; color: var(--ink); }
.fact:hover { background: var(--field); }
.fact:focus-visible { outline-offset: -3px; }
.fl { color: var(--muted); font-weight: 600; font-size: 14px; padding-top: 1px; }
.fv { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.fv .v { font-size: 15px; }
.fv .s { font-size: 12.5px; color: var(--muted); }
.fv .none { color: var(--muted); font-style: italic; }
.fact .pen { color: var(--muted); opacity: .55; padding-top: 2px; }
.fact:hover .pen, .fact:focus-visible .pen { opacity: 1; color: var(--accent); }
.eform { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 12px 16px; background: var(--field); }
.eform label { font-size: 13px; font-weight: 700; color: var(--muted); }
.eform .fld { background: var(--surface); }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--chip); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; min-height: 30px; font-size: 13px; font-weight: 700; color: var(--ink); opacity: .8; }
.seg button[aria-pressed="true"] { background: var(--surface); opacity: 1; box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 18%, transparent); }
.addrow { display: flex; gap: 8px; }
.addrow .fld { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; }
.chip.yours { border-style: dashed; }
.chip button { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.chip button:hover { background: var(--field); color: var(--ink); }
.chip-add { width: 200px; min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13.5px; }
/* gaps in What Fuzz knows: dashed "+ Goal" chips, and the add forms they open */
.gaps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.gaps-l { font-size: 13px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.gchip { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); background: transparent; color: var(--ink); font-size: 13.5px; font-weight: 700; cursor: pointer; list-style: none; }
.gchip svg { color: var(--accent); }
.gchip:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.gchip.solid { border-style: solid; border-color: var(--line); background: var(--surface); font-weight: 600; text-align: left; }
.gmore { position: relative; }
.gmore summary::-webkit-details-marker { display: none; }
.gmore .dmenu { left: 0; right: auto; }
.sugs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.choice { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.choice:hover { border-color: var(--accent); }
.choice b { font-size: 14.5px; }
.choice span { font-size: 12.5px; color: var(--muted); }
.dabout .btn { flex: none; }
/* fact rows: the row edits, the x removes; Undo right under the list */
.facts li.fact-row { display: flex; align-items: stretch; }
.fact-row .fact { flex: 1; min-width: 0; padding-right: 8px; }
.fact-row:hover { background: var(--field); }
.fact-row .fact:hover { background: transparent; }
.frm { flex: none; width: 44px; border: 0; background: transparent; color: var(--muted); opacity: .55; display: grid; place-items: start center; padding-top: 14px; }
.fact-row:hover .frm, .frm:focus-visible { opacity: 1; }
.frm:hover { color: var(--blocked); }
.undo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--field); font-size: 14px; }
.undo span { flex: 1 1 240px; }
/* artifacts from the series' tasks, shaped like the Artifacts page rows */
.afile { flex: none; width: 36px; height: 44px; border-radius: 7px 12px 7px 7px; display: inline-flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
  font-size: 10px; font-weight: 800; letter-spacing: .04em; background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
.afile--word { background: color-mix(in srgb, #2B5CC8 16%, var(--surface)); }
.afile--slides { background: color-mix(in srgb, #C8572B 18%, var(--surface)); }
.afile--pdf { background: color-mix(in srgb, #B8323A 15%, var(--surface)); }
.afile--markdown { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.afile--table { background: color-mix(in srgb, var(--done) 18%, var(--surface)); }
.linkbtn { align-self: flex-start; border: 0; background: none; padding: 4px 2px; min-height: 36px; color: var(--link); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
/* people: the most involved first; past 5 the rest fold, with a filter */
.av.big { width: 34px; height: 34px; margin: 0; font-size: 12px; border: 0; flex: none; }
.prow { min-height: 54px; padding-block: 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kv > div { padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kv h3 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); opacity: .75; }
.kv p { font-size: 14px; }
.kv .meta { font-size: 12.5px; }
@media (max-width: 560px) {
  .fact { grid-template-columns: minmax(0, 1fr) auto; }
  .fact .fl { grid-column: 1 / -1; }
  .dtitle .meta { display: none; }
}
.ep-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ep-top .rt { flex: 1 1 auto; min-width: 0; }
.strip { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.dot.d, .dot.five { background: color-mix(in srgb, var(--done) 70%, var(--surface)); }
.dot.o { border: 2px solid color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.dot.n { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.strip .meta { margin-left: 8px; font-size: 12.5px; }
.ln { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
.ln b { color: var(--muted); font-weight: 600; }
.ln.next span { font-weight: 700; }
.ep-acts { display: flex; justify-content: flex-end; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* C: in a sentence */
.scs { display: flex; flex-direction: column; gap: 12px; }
.sc { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.sc h3 { font-family: var(--font-display); font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sc .prose { font-size: 15px; line-height: 1.55; max-width: 62ch; }
.sc .prose em { font-style: normal; color: var(--muted); font-size: 13px; }

    var t = e.target.closest('[data-tab]'); if (t) { tasksTab = t.dataset.tab; paint(); return; }
    var rm = e.target.closest('[data-rmfact]');
    if (rm) { var row = det(cur).facts[+rm.dataset.rmfact]; removed = { k: cur, row: row, prev: row.slice() }; row[1] = ''; editing = null; paint(); return; }
    if (e.target.closest('[data-undo]') && removed) { var r0 = removed.row; r0[1] = removed.prev[1]; r0[2] = removed.prev[2]; r0[3] = removed.prev[3]; removed = null; paint(); return; }
    if (e.target.closest('[data-people]')) { peopleAll = !peopleAll; paint(); if (peopleAll) { var q = page.querySelector('#d-pq'); if (q) q.focus(); } return; }
    var u = e.target.closest('[data-unanchor]'); if (u) { det(cur).anchors.splice(+u.dataset.unanchor, 1); paint(); }
  });
  page.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editing) { editing = null; paint(); } });
  page.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, d = det(cur), inp = f.querySelector('.fld'), v = inp ? inp.value.trim() : '';
    if (f.dataset.save) {
      if (f.dataset.save === 'about') { if (v) { d.about = v; S[cur].guess = false; } }
      else { var r = d.facts[+f.dataset.save.slice(1)]; r[1] = v; r[2] = 'you'; r[3] = 'just now'; }
      editing = null;
    } else if (f.dataset.addfact) { if (v) { setFact(d, f.dataset.addfact, v); editing = null; } }
    else if (f.hasAttribute('data-addtask') && v) { d.open.unshift([v, 'In Triage', 't-accent']); S[cur].open++; }
    else if (f.hasAttribute('data-anchor') && v) d.anchors.push([v, 1]);
    paint();
  });
  /* an open menu closes on a click anywhere else, or on Escape */
  /* Find someone: filters the people rows as you type, without repainting */
  page.addEventListener('input', function (e) {
    if (e.target.id !== 'd-pq') return;
    var q = e.target.value.trim().toLowerCase();
    page.querySelectorAll('#d-people > li').forEach(function (li) { li.hidden = q && li.dataset.name.indexOf(q) < 0; });
  });
  function closeMenus(keep) { document.querySelectorAll('details.dmore[open], details.gmore[open]').forEach(function (m) { if (m !== keep) m.removeAttribute('open'); }); }
  document.addEventListener('click', function (e) { closeMenus(e.target.closest('details.dmore, details.gmore')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(null); });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'rows');
})();
</script>
